name: Build Tenda Router Manager APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build production web bundle
        working-directory: web
        run: npm run build

      - name: Copy web build into Android assets
        run: |
          rm -rf app/src/main/assets/assets
          rm -f app/src/main/assets/index.html
          cp -r web/dist/* app/src/main/assets/

      # This exported project shipped without the gradlew wrapper script/jar,
      # so we download the exact Gradle version from gradle-wrapper.properties
      # directly instead of relying on ./gradlew. This also regenerates a
      # proper wrapper (gradlew, gradlew.bat, gradle-wrapper.jar) as a build
      # artifact so future local builds have it too.
      - name: Install Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper files
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename and stage APK
        run: |
          mkdir -p APK
          cp app/build/outputs/apk/debug/app-debug.apk APK/TendaRouterManager-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TendaRouterManager-debug-apk
          path: APK/TendaRouterManager-debug.apk
