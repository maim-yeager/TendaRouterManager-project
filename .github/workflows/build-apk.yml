name: Build Tenda Router Manager APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build production web bundle
        working-directory: web
        run: npm run build

      - name: Copy web build into Android assets
        run: |
          rm -rf app/src/main/assets/assets
          rm -f app/src/main/assets/index.html
          cp -r web/dist/* app/src/main/assets/

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename and stage APK
        run: |
          mkdir -p APK
          cp app/build/outputs/apk/debug/app-debug.apk APK/TendaRouterManager-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TendaRouterManager-debug-apk
          path: APK/TendaRouterManager-debug.apk
